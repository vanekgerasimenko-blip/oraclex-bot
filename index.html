<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OracleX</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap');

/* ════════════════════════════════════════
   DESIGN TOKENS — всі змінні в одному місці
   Щоб змінити тему — редагуй тільки тут
════════════════════════════════════════ */
:root{
  /* ── Backgrounds ── */
  --bg:        #060a12;   /* основний фон */
  --card:      #0c1522;   /* фон карток */
  --card2:     #101c2e;   /* фон вкладених елементів */

  /* ── Brand Colors ── */
  --g:         #00e5a0;   /* зелений акцент (YES, прибуток) */
  --g2:        #00b87a;   /* темніший зелений */
  --r:         #ff3057;   /* червоний акцент (NO, збиток) */
  --r2:        #c81f3e;   /* темніший червоний ← був відсутній! */
  --gold:      #ffb800;   /* золотий (монети, streak) */
  --gold2:     #ffd060;   /* світліший золотий */
  --blue:      #0ea5e9;   /* блакитний (статистика) */
  --purple:    #8b5cf6;   /* фіолетовий (challenge) */

  /* ── Typography ── */
  --text:      #e2f0ff;   /* основний текст */
  --sub:       #4a6a8e;   /* вторинний текст */

  /* ── Borders ── */
  --b2:        rgba(255,255,255,.06);   /* тонкі межі */
  --b-green:   rgba(0,229,160,.2);      /* зелена межа */
  --b-gold:    rgba(255,184,0,.2);      /* золота межа */

  /* ── Shadows / Glows ── */
  --glow-g:    0 4px 20px rgba(0,229,160,.3);
  --glow-r:    0 4px 20px rgba(255,48,87,.3);
  --glow-gold: 0 4px 20px rgba(255,184,0,.3);

  /* ── Spacing ── */
  --r-card:    16px;  /* border-radius карток */
  --r-btn:     12px;  /* border-radius кнопок */
  --r-pill:    20px;  /* border-radius пілюль */

  /* ── Typography Scale ── */
  --f-display: 'Barlow Condensed', sans-serif;
  --f-body:    'Inter', sans-serif;

  /* ── Animation ── */
  --ease:      cubic-bezier(.4,0,.2,1);
  --dur-fast:  .15s;
  --dur-mid:   .28s;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}

/* ── iOS BOUNCE + ANDROID SCROLL FIX ── */
html {
  height: 100%;
  height: 100dvh; /* dynamic viewport — враховує адресний рядок браузера */
  overflow: hidden;
  overscroll-behavior: none;
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  max-width: 430px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  height: 100%;
  height: 100dvh; /* на весь екран включно з safe area */
  overflow: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: none;
}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,229,160,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,160,.02) 1px,transparent 1px);background-size:44px 44px;pointer-events:none;z-index:0;}

/* SCREENS */
.screen{display:none;flex-direction:column;height:100%;height:100dvh;position:relative;z-index:1;}
.screen.active{display:flex;animation:fu var(--dur-mid) var(--ease);}
@keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* TOPBAR */
.tb{padding:10px 14px 8px;display:flex;align-items:center;gap:9px;z-index:80;background:linear-gradient(to bottom,rgba(6,10,18,.98) 80%,transparent);border-bottom:1px solid rgba(0,229,160,.07);flex-shrink:0;}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#122040,#0a1830);border:1.5px solid rgba(0,229,160,.3);display:flex;align-items:center;justify-content:center;font-size:16px;position:relative;flex-shrink:0;}
.av .dot{position:absolute;bottom:0;right:0;width:9px;height:9px;border-radius:50%;background:var(--g);border:1.5px solid var(--bg);}
.tb-mid{flex:1;}
.tb-name{font-size:13px;font-weight:700;}
.tb-sub{font-size:10px;color:var(--sub);display:flex;align-items:center;gap:4px;margin-top:1px;}
.lvl{background:rgba(255,184,0,.1);border:1px solid rgba(255,184,0,.2);border-radius:5px;padding:1px 6px;font-size:9px;font-weight:800;color:var(--gold);}
.bal-pill{display:flex;align-items:center;gap:5px;background:rgba(0,229,160,.07);border:1px solid var(--b-green);border-radius:var(--r-pill);padding:5px 11px;flex-shrink:0;}
.bal-n{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:800;color:var(--g);}
.streak-chip{font-size:13px;font-weight:800;color:var(--gold2);font-family:'Barlow Condensed',sans-serif;flex-shrink:0;}
.back-btn{font-size:24px;cursor:pointer;color:var(--sub);padding:0 4px;flex-shrink:0;}
.tb-title{flex:1;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:900;letter-spacing:.5px;}

/* BOTTOM NAV */
.bnav{background:rgba(6,10,18,.97);backdrop-filter:blur(20px);border-top:1px solid rgba(0,229,160,.08);display:flex;flex-shrink:0;z-index:90;padding-bottom:env(safe-area-inset-bottom);}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;padding:9px 0 7px;cursor:pointer;gap:3px;transition:opacity var(--dur-fast);}
.ni-ic{font-size:20px;transition:transform var(--dur-fast) var(--ease),filter var(--dur-fast) var(--ease);}
.ni-lb{font-size:9px;font-weight:700;color:var(--sub);font-family:var(--f-display);transition:color var(--dur-fast);}
.ni.active .ni-lb{color:var(--g);}
.ni.active .ni-ic{filter:drop-shadow(0 0 4px rgba(0,229,160,.7));transform:scale(1.1);}
.ni:active .ni-ic{transform:scale(.88)!important;}

/* SCROLL */
.sc{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;}
.sc::-webkit-scrollbar{display:none;}
.bpad{height:16px;}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   TIKTOK FEED
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
#s-feed{overflow:hidden;}

/* vertical scroll-snap container */
#feed-scroll{
  flex:1;
  overflow-y:scroll;
  overflow-x:hidden;
  scroll-snap-type:y mandatory;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  min-height:0;
}
#feed-scroll::-webkit-scrollbar{display:none;}

/* each card = full viewport slot */
.scard{
  scroll-snap-align:start;
  scroll-snap-stop:always;
  width:100%;
  height:100%; /* filled by JS */
  flex-shrink:0;
  position:relative;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:var(--card);
  touch-action:pan-y; /* allow vertical scroll */
}

/* FULL BG visual */
.sv{
  position:absolute;
  inset:0;
  overflow:hidden;
  z-index:0;
}
.sv-noise{
  position:absolute;inset:0;
  opacity:.08;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:200px 200px;
  z-index:1;
}
.sv-icon{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-70%);
  font-size:100px;
  opacity:.18;
  z-index:1;
  filter:blur(2px);
  pointer-events:none;
}
.sv-ov{
  position:absolute;inset:0;
  background:linear-gradient(
    to bottom,
    rgba(6,10,18,.5) 0%,
    transparent 30%,
    transparent 45%,
    rgba(6,10,18,.97) 75%
  );
  z-index:1;
}
.sv-cat{
  position:absolute;top:14px;left:14px;z-index:3;
  background:rgba(6,10,18,.7);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.1);border-radius:8px;
  padding:4px 10px;font-size:11px;font-weight:700;
}
.sv-timer{
  position:absolute;top:14px;right:14px;z-index:3;
  background:rgba(6,10,18,.7);backdrop-filter:blur(8px);
  border:1px solid rgba(255,184,0,.3);border-radius:8px;
  padding:4px 10px;font-size:11px;font-weight:700;color:var(--gold2);
  display:flex;align-items:center;gap:4px;
}
.tdot{width:6px;height:6px;border-radius:50%;background:var(--gold2);animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* CONTENT sits at bottom */
.sb{
  position:absolute;
  bottom:0;left:0;right:0;
  z-index:2;
  padding:16px 16px 14px;
}
.sq{
  font-family:'Barlow Condensed',sans-serif;
  font-size:26px;font-weight:900;line-height:1.15;
  color:var(--text);margin-bottom:6px;
}
.ss{font-size:12px;color:rgba(226,240,255,.7);line-height:1.45;margin-bottom:10px;}
.pt{height:6px;border-radius:4px;background:rgba(255,48,87,.25);overflow:hidden;margin-bottom:6px;}
.pf{height:100%;border-radius:4px;background:linear-gradient(to right,var(--g2),var(--g));}
.pr{display:flex;justify-content:space-between;margin-bottom:10px;}
.py{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:800;color:var(--g);}
.pn{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:800;color:var(--r);}

/* social proof */
.soc{display:flex;align-items:center;gap:6px;margin-bottom:12px;font-size:11px;color:rgba(226,240,255,.6);}
.savs{display:flex;}
.sa{width:18px;height:18px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:10px;border:1.5px solid rgba(255,255,255,.1);margin-right:-5px;}
.sb2{color:var(--gold2);font-weight:700;}

/* BIG YES / NO buttons */
.rw{display:flex;gap:10px;}
.rwy{
  flex:1;padding:14px 10px;border-radius:var(--r-btn);border:none;cursor:pointer;
  background:linear-gradient(135deg,#005533,#009960);
  color:#fff;font-family:var(--f-display);
  font-size:22px;font-weight:900;letter-spacing:.5px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  box-shadow:var(--glow-g);
  transition:transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
.rwn{
  flex:1;padding:14px 10px;border-radius:var(--r-btn);border:none;cursor:pointer;
  background:linear-gradient(135deg,#770020,#bb1a36);
  color:#fff;font-family:var(--f-display);
  font-size:22px;font-weight:900;letter-spacing:.5px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  box-shadow:var(--glow-r);
  transition:transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
.rwy:active,.rwn:active{transform:scale(.95);}
.rwy.voted{background:var(--g);color:#03120a;box-shadow:0 4px 24px rgba(0,229,160,.5);}
.rwn.voted{background:var(--r);color:#fff;box-shadow:0 4px 24px rgba(255,48,87,.5);}
.rwp{font-size:11px;opacity:.8;font-weight:600;letter-spacing:0;}

/* ── CREATE BUTTON IN NAV ── */
.ni-create{
  flex:1;display:flex;flex-direction:column;align-items:center;
  padding:4px 0 7px;cursor:pointer;gap:3px;
}
.ni-create-circle{
  width:44px;height:44px;border-radius:50%;
  background:linear-gradient(135deg,var(--g2),var(--g));
  display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:300;color:#03120a;
  margin-top:-16px;
  border:2px solid var(--bg);
  box-shadow:0 0 20px rgba(0,229,160,.5);
  transition:transform var(--dur-fast) var(--ease);
  line-height:1;
}
.ni-create:active .ni-create-circle{transform:scale(.9);}
.ni-create-lb{
  font-size:9px;font-weight:800;color:var(--g);
  font-family:var(--f-display);letter-spacing:.3px;
}

/* ── CREATE FORM ── */
.cf-section{padding:0 14px 14px;}
.cf-label{
  font-family:var(--f-display);font-size:13px;font-weight:700;
  color:var(--text);margin-bottom:4px;letter-spacing:.3px;
}
.cf-req{color:var(--r);}
.cf-hint{font-size:10px;color:var(--sub);margin-bottom:8px;line-height:1.5;}
.cf-input{
  width:100%;background:var(--card);
  border:1px solid var(--b2);border-radius:12px;
  padding:12px 14px;color:var(--text);
  font-family:var(--f-body);font-size:14px;
  resize:none;outline:none;
  transition:border-color var(--dur-fast);
  caret-color:var(--g);
}
.cf-input:focus{border-color:var(--g);}
.cf-input::placeholder{color:var(--sub);}
.cf-textarea{height:72px;line-height:1.5;}
.cf-counter{font-size:10px;color:var(--sub);text-align:right;margin-top:4px;}

.cf-cats{display:flex;flex-wrap:wrap;gap:7px;}
.cf-cat{
  padding:7px 14px;border-radius:20px;
  background:var(--card);border:1px solid var(--b2);
  font-size:12px;font-weight:600;color:var(--sub);cursor:pointer;
  transition:all var(--dur-fast);
}
.cf-cat.active{background:rgba(0,229,160,.12);border-color:var(--g);color:var(--g);}

.cf-icons{display:flex;flex-wrap:wrap;gap:8px;}
.cf-icon{
  width:42px;height:42px;border-radius:11px;
  background:var(--card);border:1px solid var(--b2);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;cursor:pointer;
  transition:all var(--dur-fast);
}
.cf-icon.active{background:rgba(0,229,160,.12);border-color:var(--g);}

.cf-deadlines{display:flex;gap:7px;flex-wrap:wrap;}
.cf-dl{
  padding:7px 14px;border-radius:20px;
  background:var(--card);border:1px solid var(--b2);
  font-size:12px;font-weight:700;color:var(--sub);cursor:pointer;
  transition:all var(--dur-fast);font-family:var(--f-display);
}
.cf-dl.active{background:rgba(255,184,0,.12);border-color:var(--gold);color:var(--gold2);}

.cf-starter-row{display:flex;flex-direction:column;gap:10px;}
.cf-side-btns{display:flex;gap:8px;}
.cf-side{
  flex:1;padding:11px;border-radius:12px;border:none;cursor:pointer;
  font-family:var(--f-display);font-size:17px;font-weight:900;
  transition:all var(--dur-fast);
}
.cf-yes{background:rgba(0,229,160,.1);color:var(--g);border:1px solid rgba(0,229,160,.25);}
.cf-no {background:rgba(255,48,87,.1); color:var(--r);border:1px solid rgba(255,48,87,.25);}
.cf-yes.active{background:var(--g);color:#03120a;box-shadow:var(--glow-g);}
.cf-no.active {background:var(--r);color:#fff;   box-shadow:var(--glow-r);}

.cf-amount-row{display:flex;align-items:center;gap:8px;}
.cf-amount-label{font-size:12px;color:var(--sub);white-space:nowrap;}
.cf-amounts{display:flex;gap:6px;}
.cf-am{
  padding:6px 12px;border-radius:20px;border:1px solid var(--b2);
  background:var(--card);color:var(--sub);
  font-family:var(--f-display);font-size:13px;font-weight:700;cursor:pointer;
  transition:all var(--dur-fast);
}
.cf-am.active{background:rgba(255,184,0,.12);border-color:var(--gold);color:var(--gold2);}

/* PREVIEW */
.cf-preview{
  background:var(--card);border:1px solid rgba(0,229,160,.2);
  border-radius:16px;padding:14px;
  box-shadow:0 0 20px rgba(0,229,160,.06);
}
.cf-prev-icon{font-size:32px;margin-bottom:8px;}
.cf-prev-q{
  font-family:var(--f-display);font-size:18px;font-weight:800;
  color:var(--text);line-height:1.3;margin-bottom:12px;
}
.cf-prev-bar{display:flex;justify-content:space-between;}
.cf-prev-yes{font-size:12px;font-weight:700;color:var(--g);}
.cf-prev-no {font-size:12px;font-weight:700;color:var(--r);}

/* SUBMIT */
.cf-submit{
  width:100%;padding:16px;border-radius:14px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--g2),var(--g));
  color:#03120a;font-family:var(--f-display);
  font-size:18px;font-weight:900;letter-spacing:.5px;
  box-shadow:var(--glow-g);
  transition:all var(--dur-fast) var(--ease);
}
.cf-submit:disabled{
  background:var(--card2);color:var(--sub);
  box-shadow:none;cursor:not-allowed;
}
.cf-submit:not(:disabled):active{transform:scale(.97);}
.pool-section{margin-bottom:10px;}
.pool-bar-wrap{
  display:flex;
  height:10px; /* трохи вища для кращої видимості */
  border-radius:5px;
  overflow:hidden;
  background:rgba(255,255,255,.06);
  margin-bottom:6px;
  gap:2px; /* невеликий зазор між зеленою і червоною */
}
.pool-bar-yes{
  background:linear-gradient(to right,#00965a,var(--g)); /* яскраво зелений */
  transition:width .4s var(--ease);
  border-radius:5px 0 0 5px;
}
.pool-bar-no{
  background:linear-gradient(to right,var(--r),#cc0030); /* яскраво червоний */
  transition:width .4s var(--ease);
  border-radius:0 5px 5px 0;
  margin-left:auto;
}
.pool-labels{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.pool-lbl-yes{display:flex;align-items:center;gap:6px;}
.pool-lbl-no {display:flex;align-items:center;gap:6px;}
.pool-pct-y{font-family:var(--f-display);font-size:14px;font-weight:800;color:var(--g);}
.pool-pct-n{font-family:var(--f-display);font-size:14px;font-weight:800;color:var(--r);}
.pool-sum{font-size:11px;color:rgba(226,240,255,.6);font-weight:600;}
.pool-total{font-size:10px;color:var(--sub);text-align:center;}
.pool-total b{color:var(--gold2);}

/* ── BET SIZE SELECTOR ── */
.bet-size-row{
  display:flex;align-items:center;gap:5px;
  margin-bottom:10px;flex-wrap:wrap;
}
.bet-label{font-size:11px;color:var(--sub);font-weight:600;white-space:nowrap;}
.bet-chip{
  padding:5px 11px;border-radius:20px;border:1px solid var(--b2);
  background:var(--card2);color:var(--sub);
  font-family:var(--f-display);font-size:13px;font-weight:700;cursor:pointer;
  transition:all var(--dur-fast) var(--ease);
}
.bet-chip:active{transform:scale(.92);}
.bc-active{
  background:rgba(0,229,160,.15);
  border-color:var(--g);color:var(--g);
  box-shadow:0 0 10px rgba(0,229,160,.2);
}
.bet-bal{font-size:10px;color:var(--sub);margin-left:auto;white-space:nowrap;}
.bet-bal b{color:var(--gold2);}

/* ── BET PENDING STATE ── */
.bet-pending{
  display:flex;align-items:center;gap:10px;
  background:rgba(0,229,160,.07);
  border:1px solid rgba(0,229,160,.2);
  border-radius:var(--r-btn);padding:12px;
}
.bp-side{
  font-family:var(--f-display);font-size:20px;font-weight:900;
  color:var(--g);white-space:nowrap;
}
.bp-info{flex:1;}
.bp-amount{font-size:11px;color:var(--sub);}
.bp-payout{font-size:11px;color:var(--sub);margin-top:2px;}
.resolve-btn{
  background:linear-gradient(135deg,rgba(255,184,0,.2),rgba(255,184,0,.1));
  border:1px solid rgba(255,184,0,.3);border-radius:9px;
  padding:8px 12px;font-family:var(--f-display);font-size:13px;font-weight:800;
  color:var(--gold2);cursor:pointer;white-space:nowrap;
  transition:all var(--dur-fast) var(--ease);
}
.resolve-btn:active{transform:scale(.95);}

/* ── BET DONE STATES ── */
.bet-done{
  width:100%;padding:14px;border-radius:var(--r-btn);text-align:center;
  font-family:var(--f-display);font-size:22px;font-weight:900;letter-spacing:.5px;
}
.bet-done-sub{font-size:12px;font-weight:600;margin-top:4px;letter-spacing:0;}
.win-done{
  background:rgba(0,229,160,.12);border:1px solid rgba(0,229,160,.3);
  color:var(--g);box-shadow:var(--glow-g);
}
.loss-done{
  background:rgba(255,48,87,.1);border:1px solid rgba(255,48,87,.25);
  color:var(--r);
}
.refund-done{
